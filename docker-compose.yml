services:
  api:
    build: .
    image: production-rag-platform:latest
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:5173"
    volumes:
      - rag-hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  rag-hf-cache: