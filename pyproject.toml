[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-platform"
version = "0.1.0"
description = "A production-oriented Retrieval-Augmented Generation platform."
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "rank-bm25",
    "sentence-transformers",
    "numpy",
    "faiss-cpu",
    "langgraph",
    "langchain-core",
    "torch",
    "transformers",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "openai",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = [
    "model: loads real ML models and needs about 6 GB of free RAM (run with -m model)",
]
pythonpath = ["src"]
